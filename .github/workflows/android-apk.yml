name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dusttale for Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout port patch
        uses: actions/checkout@v4
        with:
          path: port-patch

      - name: Checkout upstream game
        uses: actions/checkout@v4
        with:
          repository: TheoDeveloping/Dusttale-Android-Port
          path: upstream
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          yes | sdkmanager --licenses

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1.1.5
        with:
          haxe-version: '4.2.5'

      - name: Install Haxe libraries
        working-directory: upstream
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib run lime setup flixel
          haxelib install flixel-tools --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons 2.10.0 --quiet
          haxelib install hscript --quiet
          haxelib install hxCodec --quiet
          haxelib install polymod --quiet
          haxelib git extension-webm https://github.com/luckydog7/extension-webm --quiet
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git --quiet
          haxelib install actuate --quiet
          haxelib list

      - name: Apply Android chart compatibility patch
        run: |
          python3 port-patch/scripts/apply-android-patches.py upstream

      - name: Configure Lime Android toolchain
        working-directory: upstream
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Validate chart JSON
        working-directory: upstream
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          charts = list(Path("assets/preload/data").glob("**/*.json"))
          valid = 0
          for chart in charts:
              try:
                  json.loads(chart.read_text(encoding="utf-8"))
                  valid += 1
              except Exception as exc:
                  raise SystemExit(f"Invalid chart {chart}: {exc}")
          print(f"Validated {valid} chart JSON files")
          PY

      - name: Build release APK
        working-directory: upstream
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          echo "${{ github.run_number }}" > VERSION
          haxelib run lime build android -release --app-version="1.1.0-${{ github.run_number }}"

      - name: Collect APK
        if: success()
        working-directory: upstream
        run: |
          mkdir -p ../apk-output
          find export -type f -name "*.apk" -print -exec cp {} ../apk-output/ \;
          test -n "$(find ../apk-output -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dusttale-Android-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
