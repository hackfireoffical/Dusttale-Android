name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dusttale-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout port patch
        uses: actions/checkout@v4
        with:
          path: port-patch

      - name: Checkout Android game base
        uses: actions/checkout@v4
        with:
          repository: TheoDeveloping/Dusttale-Android-Port
          path: upstream
          fetch-depth: 1

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1.1.5
        with:
          haxe-version: 4.3.6

      - name: Install Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Java for legacy Lime build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Haxe libraries
        working-directory: upstream
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib --never install flixel
          haxelib run lime setup flixel
          haxelib install flixel-tools --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons 2.10.0 --quiet
          haxelib install hscript --quiet
          haxelib install hxCodec --quiet
          haxelib git faxe https://github.com/uhrobots/faxe --quiet
          haxelib install polymod --quiet
          haxelib git extension-webm https://github.com/luckydog7/extension-webm --quiet
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git --quiet
          haxelib install actuate --quiet
          haxelib list

      - name: Apply Android chart compatibility patch
        run: python3 port-patch/scripts/apply-android-patches.py upstream

      - name: Configure Lime Android toolchain
        working-directory: upstream
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Validate chart files
        working-directory: upstream
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          charts = list(Path("assets/preload/data").glob("**/*.json"))
          for chart in charts:
              json.loads(chart.read_text(encoding="utf-8"))
          print(f"Validated {len(charts)} chart JSON files")
          PY

      - name: Build release APK
        working-directory: upstream
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          haxelib run lime build android --app-version="1.1.0-${{ github.run_number }}"

      - name: Collect APK
        if: success()
        working-directory: upstream
        run: |
          mkdir -p ../apk-output
          find export -type f -name "*.apk" -print -exec cp {} ../apk-output/ \;
          test -n "$(find ../apk-output -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dusttale-Android-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
